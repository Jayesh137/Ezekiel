name: Watch Wallets

# The watch has its own workflow because it has its own tempo. `trace.yml`
# carries fourteen steps and a 15-minute ceiling; this one asks Hyperliquid
# about a handful of wallets and finishes in about a minute, so it can run far
# more often and it does not have to wait behind a frontier expansion.
#
# MEASURED 2026-09-11, and the reason this file exists: trace.yml's cron says
# every 30 minutes and GitHub actually ran it a MEDIAN OF 198 MINUTES apart
# over 73 scheduled runs — never once under 99, up to 337. Scheduled events on
# free shared runners are best-effort and are dropped under load, and seven
# workflows in this repo were competing for them. A five-hour blind spot is
# exactly the window a migration would happen in. Two answers, and both are
# here: a small job asks for less and is dropped less often, and
# `workflow_dispatch` is NOT best-effort — anything outside GitHub that can
# make one API call a minute drives this at whatever cadence it likes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Shared with trace.yml and the other committing workflows: two jobs writing
# data/ and pushing to main at once is a conflicted rebase, not a merge.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # A minute of work. The ceiling is generous only so a slow Hyperliquid
    # response cannot cancel the job before it commits what it read.
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Watch the watchlist
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_watchlist.py
      # The tripwire that cannot be reconstructed after the fact: HyperEVM
      # history is unsweepable, so a nonce that moves has to be caught live.
      - name: Watch HyperEVM
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_hyperevm.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: watch wallets [automated]"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main || git rebase --abort || true
          done
          git push origin main
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[pipeline] watch workflow failing"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body="The wallet watch failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is the fastest tripwire in the project. While it is failing, a
          watched wallet can empty, authorise an agent or withdraw to a new
          address with nothing reporting it."
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
