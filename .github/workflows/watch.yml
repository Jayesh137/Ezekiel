name: Watch Wallets

# The watch has its own workflow because it has its own tempo. `trace.yml`
# carries a dozen-plus analysis steps and a 15-minute ceiling; this one asks
# Hyperliquid about a handful of wallets and finishes in about a minute, so it
# can run far more often and does not have to wait behind a frontier expansion.
#
# MEASURED 2026-09-11, and the reason this file exists: trace.yml's cron says
# every 30 minutes and GitHub actually ran it a MEDIAN OF 198 MINUTES apart
# over 73 scheduled runs — never once under 99, up to 337. Scheduled events on
# free shared runners are best-effort and are dropped under load, and seven
# workflows in this repo were competing for them. A five-hour blind spot is
# exactly the window a migration would happen in. Two answers, and both are
# here: a small job asks for less and is dropped less often, and
# `workflow_dispatch` is NOT best-effort — anything outside GitHub that can
# make one API call a minute drives this at whatever cadence it likes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Its OWN group, not the shared `data-commit` one, since 2026-09-12.
#
# Sharing it made this job queue behind the long trace run, and a group
# holds only one PENDING run: measured on run 34658275747, a dispatch waited
# 90 seconds behind a trace job and was then dropped when the next dispatch
# arrived. A swallowed dispatch is the same shape of failure as the stalled
# frontier — an absence that looks like nothing happening — on the fastest
# tripwire in the project.
#
# What the shared group was really protecting was two jobs writing the SAME
# files. That is now handled at the source instead: `check_watchlist.py` and
# `check_hyperevm.py` were removed from trace.yml the same day, so the files
# this job writes (data/watchlist/, data/hyperevm/) have exactly one writer.
# Concurrent COMMITS remain safe without a shared group — the push step below
# rebases with -X theirs and every run rewrites its own files whole.
# (The group is set on the `watch` job, behind the cron gate.)

jobs:
  # Cron runs only: step aside rather than evict a run already waiting in the
  # concurrency group, or repeat one the keeper ran moments ago
  # (scripts/keep_schedule.py `gate`). Concurrency sits on the job below, not
  # the workflow, so a run that steps aside never enters the group at all.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/keep_schedule.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - name: Gate the cron run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/keep_schedule.py --gate watch.yml

  watch:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || needs.gate.outputs.run != 'false') }}
    concurrency:
      group: watch-data
      cancel-in-progress: false
    # A minute of work. The ceiling is generous only so a slow Hyperliquid
    # response cannot cancel the job before it commits what it read.
    # A backstop only; the step below carries its own. Raised from 8 when the
    # watch stopped being one hand-picked wallet and started covering every
    # roster CONFIRMED/PROBABLE too (up to watchlist.MAX_WATCHED = 6). Raised
    # to 20 when the deposit-address step joined: the job ceiling must stay
    # above the sum of its step timeouts (8 + 3 + 5), or a slow run is
    # CANCELLED and the commit step never persists what the others read.
    # Raised again to 25 for the Circle-flow step (8 + 3 + 5 + 4 + 2 = 22), and
    # the boundary-attribution step keeps it inside 30 (8 + 3 + 5 + 4 + 4 + 2 + 2 = 28).
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - id: deps
        run: pip install -r requirements.txt
      - name: Watch the watchlist
        # Every detector step runs whatever its SIBLINGS did — see
        # tests/test_workflow_step_independence.py. HyperEVM used to be skipped
        # whenever the watchlist step failed.
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        # Bounded so one hung endpoint cannot cost the whole run: a STEP
        # timeout fails only the step, leaving `if: always()` on the commit to
        # persist what was read, where a JOB timeout cancels and commits
        # nothing. Observed 60-73s for one wallet.
        timeout-minutes: 8
        run: python scripts/check_watchlist.py
      # The tripwire that cannot be reconstructed after the fact: HyperEVM
      # history is unsweepable, so a nonce that moves has to be caught live.
      - name: Watch HyperEVM
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        # A few nonce reads; bounded so a hung RPC costs only this step.
        timeout-minutes: 3
        run: python scripts/check_hyperevm.py
      # His private exchange deposit addresses, read from their OWN side: a
      # deposit address belongs to one exchange account, so a new outside
      # sender is his account funded by a wallet nobody knew. linkage.py only
      # compared swept wallets' outbound and never saw the one outsider that
      # ever paid 0x8570c2ae (0xda0932d2, $249,994, 2024-07-31). The shared
      # activity cache is read-only here: its writer is trace.yml's graph step.
      - name: Watch his private deposit addresses
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        # Measured locally: 7s cold substrate walk, 0.4s warm; the sweeps are
        # incremental. Bounded well above that so a hung endpoint costs only
        # this step.
        timeout-minutes: 5
        run: python scripts/check_deposit_sentinels.py
      # Every Circle transfer into and out of Hyperliquid, both ends named by
      # Circle's own events on HyperEVM: a wallet of his funding an account
      # outside the cluster, or an outside account paying one of his addresses,
      # from ANY chain - including Monad, where $11.8M of his sits in Aave.
      - name: Watch Circle flows in and out of Hyperliquid
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        # READ_SECONDS is 120; a hung call is bounded by its own 30s timeout.
        timeout-minutes: 4
        run: python scripts/check_circle_flows.py
      # Hyperliquid's own edge, read on Arbitrum: Bridge2's FinalizedWithdrawal
      # names the account that withdrew AND where the money went, for every
      # account (docs/superpowers/specs/2026-10-06-boundary-trace-design.md).
      # An outside account paying one of his addresses — a wallet, a private
      # deposit address, his Solana wallet through Unit — is the attribution
      # no other detector makes. Reads the perimeter trace.yml builds; with
      # none yet it watches the config wallets alone.
      - name: Attribute withdrawals to his world
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        # Internal: one 140s clock (check_boundary.RUN_SECONDS): a <=60s Bridge2
        # walk, then core histories, 8 Unit reads and retro; the rest waits.
        timeout-minutes: 4
        run: python scripts/check_boundary.py
      # Crosswise freshness: this job reports the feeds trace, scan, analyze
      # and the collector write; trace.yml reports this job's. A dead detector
      # writes the same nothing as a quiet target (src/feed_health.py).
      - name: Check other workflows' detector feeds
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        timeout-minutes: 2
        run: python scripts/check_feed_health.py other
      # ALWAYS: a step that failed costs its own reading, not the whole run's.
      # Every writer rewrites its own file whole, so a file not updated this
      # run keeps the previous value. (Job CANCELLATION still skips this — only
      # a step-level failure is survivable.)
      - name: Preserve observations for the discovery scanner
        id: discovery_snapshot
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        timeout-minutes: 2
        run: python scripts/discovery_artifacts.py snapshot --kind observations
      - uses: actions/upload-artifact@v6
        id: observation_upload
        if: ${{ !cancelled() && steps.discovery_snapshot.conclusion == 'success' && steps.discovery_snapshot.outputs.artifact_path != '' }}
        with:
          name: ${{ steps.discovery_snapshot.outputs.artifact_name }}
          path: ${{ steps.discovery_snapshot.outputs.artifact_path }}
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Commit and push
        if: always()
        run: |
          python scripts/discovery_cursor_guard.py --producer circle --snapshot '${{ steps.discovery_snapshot.conclusion }}' --upload '${{ steps.observation_upload.conclusion }}' --artifact '${{ steps.observation_upload.outputs.artifact-id }}'
          # Before anything else: a blob over 100 MiB is refused by GitHub's
          # pre-receive hook, which fails the push AFTER the work is done and
          # throws the run's whole reading away. On 2026-09-12 the transfer
          # graph crossed that line and 12 consecutive trace runs died here,
          # with the one sentence naming the file buried among five identical
          # retry rejections. Said plainly, first, and nothing is committed.
          python scripts/check_repo_size.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: watch wallets [automated]"
          # Generated data is rewritten whole by every run, so a conflict here
          # has a right answer: the run that is pushing holds the newer reading.
          # During a REBASE "theirs" is the commit being replayed — ours — so
          # -X theirs keeps this run's files while leaving untouched every file
          # only the other side changed.
          #
          # The loop this replaces could not settle a conflict at all. A bare
          # `git pull --rebase` left the tree mid-rebase, so every later retry
          # failed for the wrong reason; aborting back to our own commit just
          # met the same deterministic conflict on the next attempt and the run
          # ended by opening a failure issue with its reading thrown away.
          # Measured: run 34630235534 on 2026-09-11 lost a whole watch reading
          # to a conflict in three data/*/latest.json files.
          # --autostash, because a rebase REFUSES to start with unstaged
          # changes in the tree ("error: cannot rebase: You have unstaged
          # changes"), and this step commits only `data/`. Measured on run
          # 34674713719: the commit itself succeeded (17 files, including the
          # first Circle pool), the push lost a race, and then all five rebase
          # attempts failed for that reason and the whole reading was dropped.
          # Anything left unstaged is by definition not what this step commits,
          # so stashing it across the rebase is exactly right.
          git status --porcelain | head -20
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs --autostash FETCH_HEAD; then
              git rebase --abort || true
              echo "attempt $i: rebase could not be settled automatically"
            fi
            # Jitter, so two jobs racing do not retry in lockstep forever.
            sleep $(( (RANDOM % 7) + 3 ))
          done
          git push origin main
      # Opens the issue AND pushes HIGH to ntfy, again every 6h while it stays
      # red (scripts/pipeline_status.py): trace failed 34 runs in a row on
      # 2026-09-29/30 behind an issue opened once and never looked at.
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/pipeline_status.py --outcome failure
          --title "[pipeline] watch workflow failing" --note "This is the fastest tripwire in the project. While it is failing, a watched wallet can empty, authorise an agent or withdraw to a new address with nothing reporting it."
      # Closes that issue on recovery, so the next failure alerts afresh.
      - name: Close failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/pipeline_status.py --outcome success
          --title "[pipeline] watch workflow failing"
