name: Watch Wallets

# The watch has its own workflow because it has its own tempo. `trace.yml`
# carries a dozen-plus analysis steps and a 15-minute ceiling; this one asks
# Hyperliquid about a handful of wallets and finishes in about a minute, so it
# can run far more often and does not have to wait behind a frontier expansion.
#
# MEASURED 2026-09-11, and the reason this file exists: trace.yml's cron says
# every 30 minutes and GitHub actually ran it a MEDIAN OF 198 MINUTES apart
# over 73 scheduled runs — never once under 99, up to 337. Scheduled events on
# free shared runners are best-effort and are dropped under load, and seven
# workflows in this repo were competing for them. A five-hour blind spot is
# exactly the window a migration would happen in. Two answers, and both are
# here: a small job asks for less and is dropped less often, and
# `workflow_dispatch` is NOT best-effort — anything outside GitHub that can
# make one API call a minute drives this at whatever cadence it likes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Its OWN group, not the shared `data-commit` one, since 2026-09-12.
#
# Sharing it made this job queue behind the long trace run, and a group
# holds only one PENDING run: measured on run 34658275747, a dispatch waited
# 90 seconds behind a trace job and was then dropped when the next dispatch
# arrived. A swallowed dispatch is the same shape of failure as the stalled
# frontier — an absence that looks like nothing happening — on the fastest
# tripwire in the project.
#
# What the shared group was really protecting was two jobs writing the SAME
# files. That is now handled at the source instead: `check_watchlist.py` and
# `check_hyperevm.py` were removed from trace.yml the same day, so the files
# this job writes (data/watchlist/, data/hyperevm/) have exactly one writer.
# Concurrent COMMITS remain safe without a shared group — the push step below
# rebases with -X theirs and every run rewrites its own files whole.
concurrency:
  group: watch-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # A minute of work. The ceiling is generous only so a slow Hyperliquid
    # response cannot cancel the job before it commits what it read.
    # A backstop only; the step below carries its own. Raised from 8 when the
    # watch stopped being one hand-picked wallet and started covering every
    # roster CONFIRMED/PROBABLE too (up to watchlist.MAX_WATCHED = 6).
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Watch the watchlist
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        # Bounded so one hung endpoint cannot cost the whole run: a STEP
        # timeout fails only the step, leaving `if: always()` on the commit to
        # persist what was read, where a JOB timeout cancels and commits
        # nothing. Observed 60-73s for one wallet.
        timeout-minutes: 8
        run: python scripts/check_watchlist.py
      # The tripwire that cannot be reconstructed after the fact: HyperEVM
      # history is unsweepable, so a nonce that moves has to be caught live.
      - name: Watch HyperEVM
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_hyperevm.py
      # ALWAYS: a step that failed costs its own reading, not the whole run's.
      # Every writer rewrites its own file whole, so a file not updated this
      # run keeps the previous value. (Job CANCELLATION still skips this — only
      # a step-level failure is survivable.)
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: watch wallets [automated]"
          # Generated data is rewritten whole by every run, so a conflict here
          # has a right answer: the run that is pushing holds the newer reading.
          # During a REBASE "theirs" is the commit being replayed — ours — so
          # -X theirs keeps this run's files while leaving untouched every file
          # only the other side changed.
          #
          # The loop this replaces could not settle a conflict at all. A bare
          # `git pull --rebase` left the tree mid-rebase, so every later retry
          # failed for the wrong reason; aborting back to our own commit just
          # met the same deterministic conflict on the next attempt and the run
          # ended by opening a failure issue with its reading thrown away.
          # Measured: run 34630235534 on 2026-09-11 lost a whole watch reading
          # to a conflict in three data/*/latest.json files.
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs FETCH_HEAD; then
              git rebase --abort || true
              echo "attempt $i: rebase could not be settled automatically"
            fi
            # Jitter, so two jobs racing do not retry in lockstep forever.
            sleep $(( (RANDOM % 7) + 3 ))
          done
          git push origin main
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[pipeline] watch workflow failing"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          body="The wallet watch failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is the fastest tripwire in the project. While it is failing, a
          watched wallet can empty, authorise an agent or withdraw to a new
          address with nothing reporting it."
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$existing" --body "$body"
          fi
