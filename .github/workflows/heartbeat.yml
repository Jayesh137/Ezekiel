name: Collection Heartbeat

# Watches the watcher. The system was silently dead for 21 days because every
# other alert requires the collector to be running. This job only reads
# committed data, so it stays green (and keeps alerting) while collection is down.

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2h, offset so it never collides with collect
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Only data/index.json and src/ are needed — avoid pulling the whole
          # data tree just to read one timestamp.
          sparse-checkout: |
            src
            data/index.json
            data/state
            config.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Check collection freshness
        env:
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python src/heartbeat.py
      - name: Open stale-collection issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[pipeline] data collection is stale"
          count=$(gh issue list --state open --search "in:title $title" --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh issue create --title "$title" \
              --body "Collection has stopped producing fresh data. Check the 'Collect Trading Data' workflow. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
