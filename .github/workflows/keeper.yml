name: Schedule Keeper

# Keeps watch/collect/trace/scan/analyze on their intervals without any machine
# of ours being awake. See scripts/keep_schedule.py for the rules and why.
#
# 2026-09-28: the PC dispatcher was asleep 03:45-20:50 UTC, GitHub's cron left
# an 8h20m gap in collection, and the heartbeat failed on 475-minute-old data.
#
# How it stays alive: the job ticks for an hour, then its last step dispatches
# this workflow again (workflow_dispatch is the one event a GITHUB_TOKEN may
# trigger). NOT workflow_run: a run started by GITHUB_TOKEN raises no
# workflow_run on completion, and the first version of this died after one link
# because of it. The re-dispatch step is `always()`, so a crash re-arms too;
# the hourly cron only restarts a chain that broke anyway.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# cancel-in-progress must stay FALSE: the running keeper dispatches its own
# successor, and `true` would let that successor cancel the run creating it.
# The group is set on the `keep` job. A cron run arriving while a keeper is
# running used to wait as the one pending run and then evict, or be evicted by,
# the self-dispatch (four grey "cancelled" keepers on 2026-09-29/30); its `gate`
# job now steps aside instead.

jobs:
  # Cron runs only: step aside rather than evict a run already waiting in the
  # concurrency group, or repeat one the keeper ran moments ago
  # (scripts/keep_schedule.py `gate`). Concurrency sits on the job below, not
  # the workflow, so a run that steps aside never enters the group at all.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/keep_schedule.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - name: Gate the cron run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/keep_schedule.py --gate keeper.yml

  keep:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || needs.gate.outputs.run != 'false') }}
    concurrency:
      group: schedule-keeper
      cancel-in-progress: false
    # Above the script's 60-minute budget: a job killed by its timeout would
    # still re-dispatch (always()), but it would spend the tick doing it late.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/keep_schedule.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - name: Dispatch whatever is due, for an hour
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/keep_schedule.py --ref ${{ github.event.repository.default_branch }}
      - name: Re-dispatch the keeper
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run keeper.yml --repo "$GITHUB_REPOSITORY" \
              --ref "${{ github.event.repository.default_branch }}" && exit 0
            sleep 20
          done
          echo "::error::could not re-dispatch the keeper; the hourly cron is the fallback"
          exit 1
