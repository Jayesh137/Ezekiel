name: Substrate Backfill (multi-chain transfers)
# Re-reads the cluster's transfer history across every enabled chain into
# data/transfers/. Separate from "Historical Backfill" (src/backfill.py, which
# rebuilds Hyperliquid fill history) because the two have very different
# runtimes and must not share a timeout.
#
# That sharing is not hypothetical: it was tried, and it does not work.
# src/backfill.py alone takes 48-50 minutes on this repo — every historical run
# of that workflow ran 48m16s, 49m10s, 50m16s. Adding a sweep budgeted at 2700s
# to a 3600s job leaves the sweep roughly 12 minutes before the job timeout
# kills it. And because every commit happens in the final step, a cancelled job
# discards BOTH steps' work: the sweep's cursors and the fill history alike.
#
# Split, each gets a whole job. This one spends 2700s of its 3600s ceiling on
# the sweep, leaving 15 minutes for checkout, pip and the commit/push — which
# is a real allowance here, because nothing else runs in this job.
on:
  workflow_dispatch:
    inputs:
      full_reset:
        description: 'Clear stored cursors first for a full re-read from block 0 (default: resume)'
        required: false
        type: boolean
        default: false
      wallet:
        description: 'Sweep only this address instead of the cluster (follows the money out of a counterparty)'
        required: false
        type: string

permissions:
  contents: write
  issues: write

# Shared with every other workflow that writes data/. This is what makes the
# read-modify-write in scripts/reprice_transfers.py safe, so it must stay.
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  substrate-backfill:
    runs-on: ubuntu-latest
    # Python block-buffers stdout into a pipe, so a step killed by a timeout
    # loses everything it printed and the log reads as if it never got going.
    # That cost a diagnosis on 2026-09-12: the graph step looked like it hung
    # before its first line when the whole file phase measures 18s.
    env:
      PYTHONUNBUFFERED: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Sweep every enabled chain
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FULL_RESET: ${{ inputs.full_reset }}
          # Via env, never spliced into the run: text — an address arriving from
          # a manual dispatch is untrusted input.
          WALLET: ${{ inputs.wallet }}
        run: |
          ARGS=""
          if [ -n "$WALLET" ]; then ARGS="--wallet $WALLET"; fi
          if [ "$FULL_RESET" = "true" ]; then ARGS="$ARGS --reset"; fi
          python scripts/backfill_transfers.py $ARGS
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: substrate backfill [automated]"
          # Generated data is rewritten whole by every run, so a conflict here
          # has a right answer: the run that is pushing holds the newer reading.
          # During a REBASE "theirs" is the commit being replayed — ours — so
          # -X theirs keeps this run's files while leaving untouched every file
          # only the other side changed.
          #
          # The loop this replaces could not settle a conflict at all. A bare
          # `git pull --rebase` left the tree mid-rebase, so every later retry
          # failed for the wrong reason; aborting back to our own commit just
          # met the same deterministic conflict on the next attempt and the run
          # ended by opening a failure issue with its reading thrown away.
          # Measured: run 34630235534 on 2026-09-11 lost a whole watch reading
          # to a conflict in three data/*/latest.json files.
          # --autostash, because a rebase REFUSES to start with unstaged
          # changes in the tree ("error: cannot rebase: You have unstaged
          # changes"), and this step commits only `data/`. Measured on run
          # 34674713719: the commit itself succeeded (17 files, including the
          # first Circle pool), the push lost a race, and then all five rebase
          # attempts failed for that reason and the whole reading was dropped.
          # Anything left unstaged is by definition not what this step commits,
          # so stashing it across the rebase is exactly right.
          git status --porcelain | head -20
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs --autostash FETCH_HEAD; then
              git rebase --abort || true
              echo "attempt $i: rebase could not be settled automatically"
            fi
            # Jitter, so two jobs racing do not retry in lockstep forever.
            sleep $(( (RANDOM % 7) + 3 ))
          done
          git push origin main
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[pipeline] substrate backfill failing"
          count=$(gh issue list --state open --search "in:title $title" --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh issue create --title "$title" --body "Failing run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
