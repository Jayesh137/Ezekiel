name: Sample the live tape

# The venue-wide behavioural net. Since 2026-10-14 each run reads EVERY fill on
# his markets since the last run from SQD's keyless fills portal
# (src/fills_feed.py; a block cursor, bounded per run, never skipping an unread
# range), so the sketches, the execution census, the newcomer check and the
# co-firing detector (src/cofire.py) see the whole order flow of his markets
# rather than a ~150s websocket sample in 20 min; the websocket window is the
# fallback when the portal is overloaded. It finds any wallet running his EXACT
# clip program, any wallet that opens his bursts with him to the second, and
# newcomers in size on his rare markets, all off the leaderboard and off the
# roster, with no per-wallet API call. Hits become candidates the per-wallet
# detectors examine next trace run; the only alert raised here is the dormancy
# handoff for a newcomer born in his silence.
on:
  schedule:
    - cron: '*/20 * * * *'   # best-effort; the keeper/relay drives the real cadence
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Its own group (like watch): it writes data/tape/ and per-wallet candidate files,
# and must not queue behind the long jobs in data-commit. Concurrent commits are
# settled by the -X theirs rebase below; per-wallet candidate files rarely collide,
# and observe_candidate merges, so a rare lost observation self-heals next run.
# (The group is set on the `tape` job, behind the cron gate.)

jobs:
  # Cron runs only: step aside rather than evict a run already waiting in the
  # concurrency group, or repeat one the keeper ran moments ago
  # (scripts/keep_schedule.py `gate`). Concurrency sits on the job below, not
  # the workflow, so a run that steps aside never enters the group at all.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts/keep_schedule.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - name: Gate the cron run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/keep_schedule.py --gate tape.yml

  tape:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || needs.gate.outputs.run != 'false') }}
    concurrency:
      group: tape-data
      cancel-in-progress: false
    timeout-minutes: 8   # a ~150s stream plus commit; generous backstop only
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - id: deps
        run: pip install -r requirements.txt -r requirements-stream.txt
      - name: Sample the tape for his markets
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        timeout-minutes: 5   # step-bounded so a hung socket cannot cancel the commit
        run: python scripts/collect_tape.py --seconds 150
      - name: Commit and push
        if: always()
        run: |
          python scripts/check_repo_size.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: sample live tape [automated]"
          git status --porcelain | head -20
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs --autostash FETCH_HEAD; then
              git rebase --abort || true
              echo "attempt $i: rebase could not be settled automatically"
            fi
            sleep $(( (RANDOM % 7) + 3 ))
          done
          git push origin main
      # Opens the issue AND pushes HIGH to ntfy, again every 6h while it stays
      # red (scripts/pipeline_status.py): trace failed 34 runs in a row on
      # 2026-09-29/30 behind an issue opened once and never looked at.
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/pipeline_status.py --outcome failure
          --title "[pipeline] tape workflow failing"
      # Closes that issue on recovery, so the next failure alerts afresh.
      - name: Close failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/pipeline_status.py --outcome success
          --title "[pipeline] tape workflow failing"
