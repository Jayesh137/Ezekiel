name: Scan for Matching Wallets
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write


jobs:
  # Cron runs only: step aside rather than evict a run already waiting in the
  # concurrency group, or repeat one the keeper ran moments ago
  # (scripts/keep_schedule.py `gate`). Concurrency sits on the job below, not
  # the workflow, so a run that steps aside never enters the group at all.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/keep_schedule.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - name: Gate the cron run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/keep_schedule.py --gate scan.yml

  scan:
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'skipped' || needs.gate.outputs.run != 'false') }}
    concurrency:
      group: data-commit
      cancel-in-progress: false
    # Instant alert channels (see src/alerts._send_webhooks). Optional: an
    # unset secret is an empty string, and the channel is simply skipped.
    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - id: deps
        run: pip install -r requirements.txt
      # The scanner owns the checkpoint. Fast watch/trace jobs publish facts in
      # separate shards, so they cannot overwrite scheduling or cohort history.
      - name: Restore discovery history and import observations
        id: discovery_state
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/discovery_artifacts.py restore
      - name: Discover public market participants
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.discovery_state.conclusion == 'success' }}
        timeout-minutes: 3
        run: python scripts/collect_market_discovery.py --once --max-markets 12
      - name: Join funding routes and historical authority
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.discovery_state.conclusion == 'success' }}
        timeout-minutes: 3
        run: python scripts/index_discovery_routes.py --resolve-sources
      # Fresh accounts from the leaderboard's own window volumes, before the
      # sweep, so the newest large accounts become priority targets. The
      # top-500-by-size sweep cannot see a migrated wallet until it has grown.
      - name: Find newborn accounts
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_newborn.py
      # Human-chosen names (leaderboard display names, vault names) searched
      # for the target's naming family. A hit is a reason to look, not a finding.
      - name: Search human-chosen names
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_names.py
      - run: python src/scanner.py
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.discovery_state.conclusion == 'success' }}
        timeout-minutes: 22
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      - name: Rank successor investigations from observed history
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.discovery_state.conclusion == 'success' }}
        timeout-minutes: 3
        run: python scripts/check_successor_hypotheses.py
      - name: Publish discovery quality and coverage
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        timeout-minutes: 2
        run: python scripts/evaluate_discovery.py --quality-only
      - name: Prepare discovery checkpoint
        id: discovery_snapshot
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.discovery_state.conclusion == 'success' }}
        timeout-minutes: 2
        run: python scripts/discovery_artifacts.py snapshot --kind state
      - uses: actions/upload-artifact@v4
        id: checkpoint_upload
        if: ${{ !cancelled() && steps.discovery_snapshot.conclusion == 'success' && steps.discovery_snapshot.outputs.artifact_path != '' }}
        with:
          name: ${{ steps.discovery_snapshot.outputs.artifact_name }}
          path: ${{ steps.discovery_snapshot.outputs.artifact_path }}
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
      - name: Acknowledge persisted observations and bound artifact storage
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' && steps.checkpoint_upload.conclusion == 'success' }}
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/discovery_artifacts.py cleanup --artifact-id '${{ steps.checkpoint_upload.outputs.artifact-id }}'
      # ALWAYS: a step that failed costs its own reading, not the whole run's.
      # Every writer rewrites its own file whole, so a file not updated this
      # run keeps the previous value. (Job CANCELLATION still skips this — only
      # a step-level failure is survivable.)
      - name: Commit and push
        if: always()
        run: |
          # Before anything else: a blob over 100 MiB is refused by GitHub's
          # pre-receive hook, which fails the push AFTER the work is done and
          # throws the run's whole reading away. On 2026-09-12 the transfer
          # graph crossed that line and 12 consecutive trace runs died here,
          # with the one sentence naming the file buried among five identical
          # retry rejections. Said plainly, first, and nothing is committed.
          python scripts/check_repo_size.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/calibration/ MUST be here: the scanner writes the rolling score
          # population every sweep, and omitting it meant the file was discarded
          # with the runner each hour, so the percentile gate never once activated.
          mkdir -p data/discovery data/routes data/investigations data/quality data/movements data/discovery_evaluation
          git add data/scans/ data/candidates/ data/state/ data/calibration/ data/newborn/ data/names/ profile/ data/discovery/ data/routes/ data/investigations/ data/quality/ data/movements/ data/discovery_evaluation/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: scanner results [automated]"
          # Generated data is rewritten whole by every run, so a conflict here
          # has a right answer: the run that is pushing holds the newer reading.
          # During a REBASE "theirs" is the commit being replayed — ours — so
          # -X theirs keeps this run's files while leaving untouched every file
          # only the other side changed.
          #
          # The loop this replaces could not settle a conflict at all. A bare
          # `git pull --rebase` left the tree mid-rebase, so every later retry
          # failed for the wrong reason; aborting back to our own commit just
          # met the same deterministic conflict on the next attempt and the run
          # ended by opening a failure issue with its reading thrown away.
          # Measured: run 34630235534 on 2026-09-11 lost a whole watch reading
          # to a conflict in three data/*/latest.json files.
          # --autostash, because a rebase REFUSES to start with unstaged
          # changes in the tree ("error: cannot rebase: You have unstaged
          # changes"), and this step commits only `data/`. Measured on run
          # 34674713719: the commit itself succeeded (17 files, including the
          # first Circle pool), the push lost a race, and then all five rebase
          # attempts failed for that reason and the whole reading was dropped.
          # Anything left unstaged is by definition not what this step commits,
          # so stashing it across the rebase is exactly right.
          git status --porcelain | head -20
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs --autostash FETCH_HEAD; then
              git rebase --abort || true
              echo "attempt $i: rebase could not be settled automatically"
            fi
            # Jitter, so two jobs racing do not retry in lockstep forever.
            sleep $(( (RANDOM % 7) + 3 ))
          done
          git push origin main
      # Opens the issue AND pushes HIGH to ntfy, again every 6h while it stays
      # red (scripts/pipeline_status.py): trace failed 34 runs in a row on
      # 2026-09-29/30 behind an issue opened once and never looked at.
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/pipeline_status.py --outcome failure
          --title "[pipeline] scan workflow failing"
      # Closes that issue on recovery, so the next failure alerts afresh.
      - name: Close failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/pipeline_status.py --outcome success
          --title "[pipeline] scan workflow failing"
