name: Tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dashboard/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dashboard/**'
      - 'requirements*.txt'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only data/ is excluded from checkout cost concerns here; tests use fixtures,
    # not collected data, so a shallow default checkout is fine.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - id: deps
        run: pip install -r requirements.txt pytest ruff
      # Both report independently. A lint error is not a reason to withhold
      # the answer to "do the tests pass" — and on 2026-09-16 it did exactly
      # that twice in a row: one unused import failed Lint, Tests was skipped
      # by the implicit success(), and two pushes went red without the suite
      # ever having run in CI. Three minutes of runner time is not worth not
      # knowing. Both still fail the job, so nothing is hidden.
      - name: Lint
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: python -m ruff check src/ tests/ scripts/
      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: python -m pytest -q

  dashboard:
    # The dashboard previously had no CI at all: deploy-dashboard.yml only runs on
    # dashboard/** pushes, so a broken import in api.js could merge green.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        id: npm
        working-directory: dashboard
        run: npm ci
      # node's built-in runner, so this costs no dependency. Only the pure
      # functions in src/lib are covered — getAlertDelivery is the one that
      # decides whether the operator is told alerting is dead, and email
      # cannot report its own failure, so a wrong branch there is silent.
      - name: Unit tests
        if: ${{ !cancelled() && steps.npm.conclusion == 'success' }}
        working-directory: dashboard
        run: npm test
      # Same rule: a failing unit test must not hide whether the build is
      # broken. They are two separate answers about the dashboard.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.npm.conclusion == 'success' }}
        working-directory: dashboard
        run: npm run build
      # The phone review app installs from the home screen. A build that stopped
      # being installable (a missing icon, a manifest without the /Ezekiel base)
      # still looks fine in every desktop check, so it is asserted here. Gated
      # on the build it reads, not on the unit tests beside it.
      - name: PWA installable
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        working-directory: dashboard
        run: npm run check:pwa
      # The Google Apps Script relay that replaces an always-on machine: its
      # dispatch and tripwire decisions, with Google's globals mocked. No npm
      # dependencies, so it never waits on npm ci.
      - name: Relay tests
        if: ${{ !cancelled() }}
        run: node --test scripts/apps_script/relay.test.mjs
