name: Tests
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dashboard/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'dashboard/**'
      - 'requirements*.txt'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only data/ is excluded from checkout cost concerns here; tests use fixtures,
    # not collected data, so a shallow default checkout is fine.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint
        run: python -m ruff check src/ tests/ scripts/
      - name: Tests
        run: python -m pytest -q

  dashboard:
    # The dashboard previously had no CI at all: deploy-dashboard.yml only runs on
    # dashboard/** pushes, so a broken import in api.js could merge green.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard
        run: npm run build
