name: Trace Fund Flows
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      investigate_wallet:
        description: 'Sweep this address across all chains before tracing'
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    # Instant alert channels (see src/alerts._send_webhooks). Optional: an
    # unset secret is an empty string, and the channel is simply skipped.
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    # 900s, and every budget inside this job has to fit within it. A job that
    # is CANCELLED never reaches "Commit and push", so the cursors written to
    # the runner's working tree are discarded and the next run starts from
    # block 0 again — the same livelock --reset was fixed for, reached through
    # job cancellation instead.
    #
    # BUDGETED worst case, which is what the timeout has to cover:
    #
    #   config.collection.time_budget_seconds  150   cluster sweep (tracer)
    #   tracer.TRACE_BUDGET_SECONDS            240   destination tracing loop
    #   correlator.run_correlation               1   one Etherscan call
    #   correlator --pools cctp                120   Circle pool walk (keyless)
    #   config.transfer_graph.time_budget_...  150   frontier expansion
    #   transfer_graph.CODE_LOOKUP_SECONDS      20   bytecode labelling
    #   the 2026-09-10 vectors (measured below) ~250
    #                                          ---
    #                                          811   leaving ~89s for checkout,
    #                                                pip (cached) and the push
    #
    # MEASURED, run 34618753307 on 2026-09-11 (total 6m42s), because the
    # budgets above are ceilings the steps rarely reach and the new steps have
    # no ceiling of their own — they are bounded by how many addresses they
    # ask about:
    #
    #   identities 109   agents 79   graph 52   bridges 35   dormancy 25
    #   tracer 21 (of its 390s budget: nothing new to trace that run)
    #   overlap 19   co-movement 16   checkout+pip 28   push 8
    #   withdrawals / solana / vaults / hyperevm probe   ~4 together
    #
    # The tracer is the one that can swing hardest: 21s on a quiet run against
    # a 390s budget when the target has moved money to many destinations. That
    # gap is why the timeout is 15 minutes rather than the 10 this job ran at
    # when it held five fewer steps — at 10 the first busy run would be
    # cancelled and lose the commit. The schedule asks for every 30 minutes and
    # the concurrency group below is what actually guarantees no overlap: this
    # cron is delivered a median of 198 minutes apart in practice (measured
    # 2026-09-11 over 73 runs), which is why the watch has its own small
    # workflow in watch.yml rather than depending on this one.
    #
    # The steps above run on every dispatch, scheduled or manual. "Investigate
    # a specific wallet" below runs ONLY on a manual dispatch that sets
    # investigate_wallet, and it runs FIRST, so on that path its own budget is
    # additive to the 811 above, not a substitute for any of it.
    #
    # 9s does not complete a multi-chain sweep for a wallet with real history —
    # scripts/backfill_transfers.py's own default (config.backfill, 2700s) is
    # what that takes, and this job cannot spare it. What 9s buys instead: the
    # step always finishes on its OWN terms (CallBudget checks elapsed time
    # before every call), so this job is never the reason a dispatch is
    # cancelled. A wallet with real history reports TRUNCATED and the chains it
    # could not reach; src/chain/collect.py flushes cursors per chain, so the
    # next dispatch of this same workflow resumes rather than restarts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Investigate a specific wallet
        if: inputs.investigate_wallet != ''
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          INVESTIGATE_WALLET: ${{ inputs.investigate_wallet }}
        # 9s, not backfill_transfers.py's own (backfill-sized) default — see
        # the job-level comment above for the arithmetic. Re-dispatch this
        # workflow with the same wallet to continue a TRUNCATED sweep.
        run: python scripts/backfill_transfers.py --wallet "$INVESTIGATE_WALLET" --time-budget-seconds 9
      - run: python src/tracer.py
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Lets a failed email fall back to a GitHub issue.
          GITHUB_TOKEN: ${{ github.token }}
      # Where every bridge transfer from the cluster went: CCTP and Socket
      # calldata name the destination chain and recipient, and Hyperliquid's
      # CCTP extension names the HyperCore account. Blockscout, no key, each
      # transaction decoded once and cached. A recipient outside the cluster
      # alerts.
      - name: Decode bridge destinations
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_bridge_destinations.py
      # Every Hyperliquid withdrawal paired with the bridge payout at his own
      # address; an unpaired one is a withdrawal to a foreign address, which
      # the ledger cannot show. Resolving one costs a few Etherscan calls.
      - name: Pair withdrawals with their payouts
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_withdrawals.py
      # The Circle candidate pool: every CCTP deposit into any Hyperliquid
      # account, read from USDC's forwarder ledger with no key, incrementally
      # from a stored cursor (src/cctp_feed.py). The bridge pool costs hundreds
      # of Etherscan calls and stays on the daily analyze job; this pool is a
      # few calls a run once filled, and a fresh wallet funded through Circle
      # from Ethereum or Base enters the correlator here and nowhere else.
      # Budgeted at config.correlation.cctp_time_budget_seconds (120s).
      - name: Correlate Circle deposits
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/correlator.py --pools cctp
      # One public-RPC call per cluster Solana address (the CCTP recipient of
      # $22.75M of his). Solana reaches Hyperliquid through Circle too.
      - name: Watch cluster Solana addresses
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_solana.py
      # `check_hyperevm.py` and `check_watchlist.py` USED to run here as well.
      # They were moved out when watch.yml was split off, and removed from this
      # job on 2026-09-12 so that those two scripts have exactly ONE writer.
      # watch.yml runs them every ~11 minutes against this job's measured
      # median of 198, so the copies here bought no freshness — and once
      # watch.yml has its own concurrency group the two jobs can overlap, at
      # which point a second writer is a lost-update bug rather than a
      # duplicate: `watchlist.changes()` diffs against the STORED previous
      # reading, so a record discarded by a concurrent write can skip the very
      # transition the watch exists to report.
      # Who moves first. A copy-trader follows the target's fills; a second
      # account run by the same hand moves with them or before. One fills call
      # per roster candidate over the scanner's 21-day window.
      - name: Score lead/lag co-movement
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_comovement.py
      # A vault led by a cluster wallet is a tradeable address of his. One call.
      - name: Watch vault leadership
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_vaults.py
      # Does the Etherscan key serve HyperEVM (chain 999)? Recorded, so the
      # answer to "can HyperEVM be swept" comes from CI rather than a guess.
      - name: Probe the HyperEVM index
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python scripts/probe_hyperevm_index.py
      # Rebuild the transfer graph from everything the tracer/correlator just
      # collected. Runs here because it shares the same Etherscan budget.
      - name: Rebuild transfer graph
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Lets a failed email fall back to a GitHub issue.
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/transfer_graph.py
      # Last, because it only merges what the detectors above just wrote. Pure
      # file reads, no network, no budget.
      # One free HL call per wallet, no key and no Etherscan budget. An agent is
      # an address an account EXPLICITLY authorised to trade for it, so two
      # accounts sharing one are the same operator - the strongest single signal
      # here. Runs before the roster so a shared agent lands in the same run.
      # Five free calls per address: who it IS on Hyperliquid — user, vault,
      # sub-account (and its master), agent (and its owner), or missing — plus
      # its current frontend agent, staking link, validators and real birth.
      # Runs before the agent check so the frontend agents are on record, and
      # before the roster so an explicit link lands in the same run.
      - name: Resolve Hyperliquid identities
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_identity.py
      - name: Check authorised agents
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_agents.py
      # The migration signature that needs NO connection between the wallets.
      # Judged against his own rhythm (median gap 2d, p90 5d, longest ever 21d),
      # so a fixed "dormant after a week" rule cannot cry wolf. Runs before the
      # roster so a handoff lands in the same run.
      - name: Check dormancy and handoffs
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_dormancy.py
      # One free call per wallet. Rarity-weighted, so the majors count nothing.
      # Writes evidence and raises no alert: a copy-trader holds the same basket
      # by definition, which is indistinguishable here from being the same person.
      - name: Score portfolio overlap
        run: python scripts/check_portfolio_overlap.py
      - name: Build wallet roster
        run: python src/roster.py
      # After the roster, because it classifies each destination using the tiers
      # the roster just assigned. Pure file reads.
      - name: Reconcile outbound funds
        run: python src/accounting.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: trace fund flows [automated]"
          # Generated data is rewritten whole by every run, so a conflict here
          # has a right answer: the run that is pushing holds the newer reading.
          # During a REBASE "theirs" is the commit being replayed — ours — so
          # -X theirs keeps this run's files while leaving untouched every file
          # only the other side changed.
          #
          # The loop this replaces could not settle a conflict at all. A bare
          # `git pull --rebase` left the tree mid-rebase, so every later retry
          # failed for the wrong reason; aborting back to our own commit just
          # met the same deterministic conflict on the next attempt and the run
          # ended by opening a failure issue with its reading thrown away.
          # Measured: run 34630235534 on 2026-09-11 lost a whole watch reading
          # to a conflict in three data/*/latest.json files.
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs FETCH_HEAD; then
              git rebase --abort || true
              echo "attempt $i: rebase could not be settled automatically"
            fi
            # Jitter, so two jobs racing do not retry in lockstep forever.
            sleep $(( (RANDOM % 7) + 3 ))
          done
          git push origin main
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[pipeline] trace workflow failing"
          count=$(gh issue list --state open --search "in:title $title" --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh issue create --title "$title" --body "Failing run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
