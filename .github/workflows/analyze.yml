name: Daily Analysis & Fingerprint Rebuild
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Rebuild fingerprint
        run: python src/fingerprint.py
      - name: Build trader profile
        run: python src/profile_builder.py
      # Twitter monitoring disabled — all nitter RSS bridges are down.
      # Re-enable when a working Twitter data source is configured.
      # - name: Fetch new tweets
      #   run: python src/twitter_monitor.py
      # - name: Run correlation analysis
      #   run: python src/twitter_correlator.py
      - name: Pull latest before committing
        run: |
          git add profile/ reports/ data/
          git stash
          git pull --rebase origin main
          git stash pop || true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "analysis: rebuild fingerprint + daily report [automated]"
          file_pattern: "profile/** reports/** data/**"
        env:
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
