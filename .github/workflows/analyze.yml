name: Daily Analysis & Fingerprint Rebuild
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-analysis.txt
      # Roll closed days into archives and drop cross-file duplicates. Without a
      # scheduled run the storage bound is a one-off: per-minute snapshots and
      # re-polled historicalOrders regrow data/ to ~800MB within weeks, which is
      # what pushed job checkout past the collect timeout in the first place.
      # Runs before the fingerprint so the rebuild reads the compacted tree.
      - name: Compact data
        run: python scripts/compact_data.py --apply
      # Records collected while the price cache was cold sit on disk as
      # price_unavailable and are dropped before they reach the graph. The
      # per-sweep price budget is a dozen requests, so a sweep prices a handful
      # and leaves the rest; this is the pass that goes back for them, daily,
      # which is the cadence "coverage improves across runs" actually assumes.
      # Budgeted at ~240s of this 30-minute job (config.reprice). Grouped by
      # (asset, date), so ~96 reachable requests cover far more records.
      # New sweeps refuse to price a counterfeit at collection time. This is for
      # records already on disk, and for the day someone adds a canonical
      # contract for another (chain, symbol) pair — it is idempotent and only
      # judges pairs whose real contract is known.
      - name: Quarantine impostor tokens
        run: python scripts/quarantine_impostor_tokens.py --apply
      - name: Reprice stored transfers
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/reprice_transfers.py
      # Moved off trace.yml: reading the whole 14-day candidate pool does not fit
      # that job's 600s ceiling (see src/tracer.py's main). Runs after repricing
      # so exits are valued, and budgeted at 300s of this 30-minute job.
      - name: Correlate deposits and withdrawals
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Lets a failed email fall back to a GitHub issue.
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/correlator.py
      # Runs the self-match backtest, which is the only thing that can tell the
      # operator the behavioural scorer cannot identify the target. Needs the
      # alert credentials for that: without them the finding stays in a CI log.
      # Two of the five corroboration vectors depend on knowing who first funded
      # a wallet, and nothing populated that for graph wallets. Runs on the daily
      # job because a first funder never changes: each wallet costs at most one
      # lookup ever, and the cache converges over a few runs.
      - name: Resolve first funders
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python scripts/resolve_first_funders.py 40
      - name: Rebuild fingerprint
        env:
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          # Lets a failed email fall back to a GitHub issue.
          GITHUB_TOKEN: ${{ github.token }}
        run: python src/fingerprint.py
      # Tests the tracked wallet against GCR's documented style, in BOTH
      # directions. Evidence only, no alert: a style resemblance is not a
      # discovery. Daily is plenty - the source material is from 2021-2023.
      - name: Test the GCR hypothesis
        run: python scripts/check_gcr_hypothesis.py
      # The only GCR vector that is flow rather than style. His own tweet led to
      # a confirmed Ethereum address; none of that cluster has ever touched
      # Hyperliquid or the target, so this is a tripwire whose value is entirely
      # in the day one of them moves. Cheap: five HL calls against addresses
      # already on disk. This one DOES alert.
      - name: Watch GCR's Ethereum addresses
        run: python scripts/check_gcr_wallets.py
      - name: Build trader profile
        run: python src/profile_builder.py
      # Refresh the manifest so the dashboard sees the archived days and the
      # compact account series produced above.
      - name: Refresh data index
        run: python -c "from src.utils import update_index; update_index()"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/ data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "analysis: rebuild fingerprint [automated]"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          git push origin main
      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[pipeline] analyze workflow failing"
          count=$(gh issue list --state open --search "in:title $title" --json number --jq 'length')
          if [ "$count" = "0" ]; then
            gh issue create --title "$title" --body "Failing run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
