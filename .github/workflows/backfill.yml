name: Historical Backfill
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Python block-buffers stdout into a pipe, so a step killed by a timeout
    # loses everything it printed and the log reads as if it never got going.
    # That cost a diagnosis on 2026-09-12: the graph step looked like it hung
    # before its first line when the whole file phase measures 18s.
    env:
      PYTHONUNBUFFERED: "1"
    # src/backfill.py alone runs 48-50 minutes on this repo (measured across
    # every historical run), so 60 is a genuine ceiling, not a generous one.
    # The multi-chain sweep deliberately does NOT run here - see
    # substrate-backfill.yml for why sharing this job does not work.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python src/backfill.py
      - name: Commit and push
        run: |
          # Before anything else: a blob over 100 MiB is refused by GitHub's
          # pre-receive hook, which fails the push AFTER the work is done and
          # throws the run's whole reading away. On 2026-09-12 the transfer
          # graph crossed that line and 12 consecutive trace runs died here,
          # with the one sentence naming the file buried among five identical
          # retry rejections. Said plainly, first, and nothing is committed.
          python scripts/check_repo_size.py .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: historical backfill [automated]"
          # Generated data is rewritten whole by every run, so a conflict here
          # has a right answer: the run that is pushing holds the newer reading.
          # During a REBASE "theirs" is the commit being replayed — ours — so
          # -X theirs keeps this run's files while leaving untouched every file
          # only the other side changed.
          #
          # The loop this replaces could not settle a conflict at all. A bare
          # `git pull --rebase` left the tree mid-rebase, so every later retry
          # failed for the wrong reason; aborting back to our own commit just
          # met the same deterministic conflict on the next attempt and the run
          # ended by opening a failure issue with its reading thrown away.
          # Measured: run 34630235534 on 2026-09-11 lost a whole watch reading
          # to a conflict in three data/*/latest.json files.
          # --autostash, because a rebase REFUSES to start with unstaged
          # changes in the tree ("error: cannot rebase: You have unstaged
          # changes"), and this step commits only `data/`. Measured on run
          # 34674713719: the commit itself succeeded (17 files, including the
          # first Circle pool), the push lost a race, and then all five rebase
          # attempts failed for that reason and the whole reading was dropped.
          # Anything left unstaged is by definition not what this step commits,
          # so stashing it across the rebase is exactly right.
          git status --porcelain | head -20
          for i in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            git fetch origin main || true
            if ! git rebase -X theirs --autostash FETCH_HEAD; then
              git rebase --abort || true
              echo "attempt $i: rebase could not be settled automatically"
            fi
            # Jitter, so two jobs racing do not retry in lockstep forever.
            sleep $(( (RANDOM % 7) + 3 ))
          done
          git push origin main
