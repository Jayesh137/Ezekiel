name: Historical Backfill
on:
  workflow_dispatch:
    inputs:
      full_reset:
        description: 'Clear all stored cursors first for a full re-read from block 0 (default: resume)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 3600s against config.backfill.time_budget_seconds = 2700, leaving 15
    # minutes for checkout, pip, the pre-existing `python src/backfill.py`
    # step and the commit/push. A cancelled job never commits, so the cursor
    # progress this run made is lost and --reset's livelock returns.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python src/backfill.py
      - name: Backfill multi-chain transfer history
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          FULL_RESET: ${{ inputs.full_reset }}
        run: |
          if [ "$FULL_RESET" = "true" ]; then
            python scripts/backfill_transfers.py --reset
          else
            python scripts/backfill_transfers.py
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "data: historical backfill [automated]"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            git pull --rebase origin main
          done
          git push origin main
